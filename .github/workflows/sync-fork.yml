name: Sync upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/xinnan-tech/xiaozhi-esp32-server.git
          git fetch upstream
          git merge upstream/main --no-edit
          git push
